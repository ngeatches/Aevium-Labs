# Render Blueprint — STAGING. Review before applying; applying creates a paid service and disk.
# Secrets marked sync:false are entered in the Render dashboard (never committed).
# Production: duplicate this service as principium-production with DEPLOY_ENV=production,
# its own disk, its own domain/PUBLIC_ORIGIN and its own Twilio/Resend settings (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: principium-staging
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    numInstances: 1          # SQLite = exactly one instance. Do not scale out.
    healthCheckPath: /healthz
    autoDeploy: false        # deploy deliberately after review
    disk:
      name: principium-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: COMMERCE_MODE
        value: live
      - key: DEPLOY_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ACCESS_GATE
        value: password
      - key: DELIVERY_MODE
        value: test
      - key: SMS_DAILY_LIMIT
        value: "50"
      - key: PUBLIC_ORIGIN       # e.g. https://staging.yourdomain.com
        sync: false
      - key: PREVIEW_PASSWORD
        sync: false
      - key: ADMIN_PHONES
        sync: false
      - key: TEST_PHONE_ALLOWLIST
        sync: false
      - key: TEST_EMAIL_ALLOWLIST
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: MAIL_FROM            # e.g. Principium Peptides <orders@yourdomain.com>
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
